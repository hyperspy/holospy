default_install_hook_types:
  - pre-commit
  - commit-msg
repos:
  - repo: https://github.com/hyperspy/.github
    rev: 85e1d7f1a18b2e970f6e068a1b8774eb09865e27
    hooks:
      - id: check-ai-co-author
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.17.1
    hooks:
      # Run the linter.
      - id: ruff-check
        args: [ --fix ]
      # Run the formatter.
      - id: ruff-format
ci:
    # Don't run automatically on PRs, instead add the comment
    # "pre-commit.ci autofix" on a pull request to manually trigger auto-fixing 
    autofix_prs: false
    autoupdate_schedule: monthly
